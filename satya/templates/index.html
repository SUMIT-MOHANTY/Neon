<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{{ title or "Satya" }} {{ TODO: future dynamic injection }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Satya - a clean single landing page demo" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="hero-section">
        <div class="hero-overlay">
            <h1 class="hero-headline">Welcome to Satya</h1>
            <p class="hero-subtitle">{{ subtitle or "Simplicity meets design." }} {{ TODO: future dynamic injection }}</p>
            <a href="#learn-more" class="btn-cta">Learn More</a>
        </div>
    </header>

    <main id="learn-more" class="feature-section">
        <div class="container">
            <h2 class="feature-title">Features</h2>
            <ul class="feature-list">
                <li>Responsive & mobile-first</li>
                <li>WCAG-friendly color palette</li>
                <li>Buttery smooth animations</li>
            </ul>
        </div>
    </main>

    <footer class="page-footer">
        <span>&copy; 2024 Satya Project. All rights reserved.</span>
    </footer>
</body>
</html>
